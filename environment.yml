# After creating the env, run:
#   pip install standard-e2e --no-deps
#   pip install "numpy<2"   # av2 may upgrade numpy; pin it back
name: 281-s2-group2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy<2
  - pip
  - pip:
    - tensorflow==2.16.2
    - torchvision
    - albumentations
    - opencv-python-headless
    - scikit-image
    - scikit-learn
    - matplotlib
    - jupyter
    - ipykernel
    - pandas
    - pyarrow
    - pillow
    - pyyaml
    - tqdm
    - av2
    - google-auth
    - google-auth-httplib2